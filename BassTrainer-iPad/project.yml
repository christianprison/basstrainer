name: BassTrainer
options:
  bundleIdPrefix: com.basstrainer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  BassTrainer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BassTrainer
        excludes:
          - "**/*.xcassets"
    resources:
      - path: BassTrainer/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: BassTrainer/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.basstrainer.app
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_INTERFACE_ORIENTATIONS_IPAD: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
