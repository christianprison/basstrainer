name: TestFlight

# Erzeugt einen TestFlight-Build bei einem Versions-Tag (v1.2.3) oder bei Push
# auf den Arbeitsbranch (zum Iterieren, ohne Tag pushen zu müssen).
on:
  push:
    tags:
      - "v*"
    branches:
      - "claude/peaceful-bohr-2vi5K"
  workflow_dispatch:

# Nur Lese-Rechte; die Pipeline lädt nur hoch (App Store Connect), schreibt nicht ins Repo.
permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-14
    defaults:
      run:
        working-directory: BassTrainer-iPad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: BassTrainer-iPad

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Derive marketing version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Configure git auth for certs repo
        run: |
          echo "token length: ${#MATCH_GIT_TOKEN}"
          case "$MATCH_GIT_TOKEN" in
            "") echo "diag: TOKEN IS EMPTY" ;;
            github_pat_*) echo "diag: prefix github_pat_ (fine-grained) OK" ;;
            ghp_*) echo "diag: prefix ghp_ (classic)" ;;
            *) echo "diag: unexpected prefix / possible whitespace" ;;
          esac
          git config --global url."https://christianprison:${MATCH_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
